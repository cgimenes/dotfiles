[opener]
zathura = [{ run = 'zathura %s', desc = "zathura", orphan = true }]
zathura_quit = [{ run = 'ya emit quit; zathura %s', desc = "zathura and quit", orphan = true }]
mpv = [{ run = 'mpv %s', desc = "mpv", orphan = true }]
mpv_quit = [{ run = 'ya emit quit; mpv %s', desc = "mpv and quit", orphan = true }]
ristretto = [{ run = 'ristretto %s', desc = "ristretto", orphan = true }]
ristretto_quit = [{ run = 'ya emit quit; ristretto %s', desc = "ristretto and quit", orphan = true }]
execute = [{ run = '%s', orphan = true, desc = "Run" }]
execute_quit = [{ run = 'ya emit quit; %s', orphan = true, desc = "Run and quit" }]
edit = [{ run = 'nvim %s', block = true, desc = 'Edit' }]

[open]
prepend_rules = [
  { mime = 'application/pdf', use = ['zathura', 'zathura_quit'] },
  { mime = 'video/*', use = ['mpv', 'mpv_quit'] },
  { mime = 'image/*', use = ['ristretto', 'ristretto_quit'] },
  { mime = 'text/*', use = 'edit' },
  { mime = "application/x-executable", use = ['execute_quit', 'execute'] },
  { mime = "application/executable", use = ['execute_quit', 'execute'] },
  { mime = "application/x-pie-executable", use = ['execute_quit', 'execute'] },
  { mime = "application/pie-executable", use = ['execute_quit', 'execute'] },
]
