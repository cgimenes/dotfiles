[opener]
zathura = [{ run = 'zathura %s', desc = "zathura", orphan = true }]
mpv = [{ run = 'mpv %s', desc = "mpv", orphan = true }]
ristretto = [{ run = 'ristretto %s', desc = "ristretto", orphan = true }]
edit = [{ run = 'nvim %s', block = true, desc = 'Edit with Neovim' }]
execute = [{ run = '%s', orphan = true, desc = "Run Executable" }]

[open]
prepend_rules = [
  { mime = 'application/pdf', use = 'zathura' },
  { mime = 'video/*', use = 'mpv' },
  { mime = 'image/*', use = 'ristretto' },
  { mime = 'text/*', use = 'edit' },
  { mime = 'application/json', use = 'edit' },
  { mime = "application/x-executable", use = "execute" },
  { mime = "application/executable", use = "execute" },
  { mime = "application/x-pie-executable", use = "execute" },
  { mime = "application/pie-executable", use = "execute" },
]
