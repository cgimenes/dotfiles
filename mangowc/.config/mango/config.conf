# More option see https://github.com/DreamMaoMao/mango/wiki

# Auto start
exec-once=noctalia
exec-once=shikane
exec-once=foot -s

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=1

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=0
focus_cross_monitor=0
focusdir_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=250
numlockon=0
xkb_rules_layout=us,br
xkb_rules_variant=intl,thinkpad
xkb_rules_options=grp:alt_space_toggle,ctrl:nocaps

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,x,reload_config

# menu and terminal
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=Super,Return,spawn,kitty

# exit
bind=SUPER+Ctrl,q,spawn,noctalia msg panel-toggle session
bind=Super+Shift,c,killclient

# switch window focus
bind=Super,h,focusdir,left
bind=Super,l,focusdir,right
bind=Super,k,focusdir,up
bind=Super,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=Super+Shift,space,togglefloating,
bind=Super,a,togglemaximizescreen,
bind=Super,f,togglefullscreen,
bind=SUPER,tab,toggleoverview,

# scroller layout
bind=Super+shift,f,set_proportion,1.0
bind=Super,r,switch_proportion_preset,
bind=Super+ctrl,Left,scroller_stack,left
bind=Super+ctrl,Right,scroller_stack,right
bind=Super+ctrl,Up,scroller_stack,up
bind=Super+ctrl,Down,scroller_stack,down

# switch layout
circle_layout=dwindle,scroller,fair
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,i,viewtoleft,0
bind=SUPER,u,viewtoright,0

bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

bind=Super+Ctrl,1,toggleview,1,0
bind=Super+Ctrl,2,toggleview,2,0
bind=Super+Ctrl,3,toggleview,3,0
bind=Super+Ctrl,4,toggleview,4,0
bind=Super+Ctrl,5,toggleview,5,0
bind=Super+Ctrl,6,toggleview,6,0
bind=Super+Ctrl,7,toggleview,7,0
bind=Super+Ctrl,8,toggleview,8,0
bind=Super+Ctrl,9,toggleview,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Super,1,tagsilent,1
bind=Super+Shift,1,tagsilent,1,0
bind=Super+Shift,2,tagsilent,2,0
bind=Super+Shift,3,tagsilent,3,0
bind=Super+Shift,4,tagsilent,4,0
bind=Super+Shift,5,tagsilent,5,0
bind=Super+Shift,6,tagsilent,6,0
bind=Super+Shift,7,tagsilent,7,0
bind=Super+Shift,8,tagsilent,8,0
bind=Super+Shift,9,tagsilent,9,0

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+Super,Up,resizewin,+0,-50
bind=CTRL+Super,Down,resizewin,+0,+50
bind=CTRL+Super,Left,resizewin,-50,+0
bind=CTRL+Super,Right,resizewin,+50,+0

# Media
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86AudioPause,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioNext,spawn,noctalia msg media next

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
